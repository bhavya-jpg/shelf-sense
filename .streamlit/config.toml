[server]
# Must match app.pipeline.MAX_UPLOAD_MB, which the app also enforces itself.
maxUploadSize = 15
# Serves app/static/ at /app/static/ (landing-page images).
enableStaticServing = true

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"

[theme]
base = "dark"
primaryColor = "#CDFF3F"
backgroundColor = "#0A0B0C"
secondaryBackgroundColor = "#15181A"
textColor = "#ECEBE6"
font = "sans serif"
